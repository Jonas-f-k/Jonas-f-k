name: Build Shadow Slave
on:
  push:
    branches: [shadowslave/rework-0.6.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: shadowslave
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install asset checker dependency
        run: python -m pip install pillow
      - name: Compile and run GameTests
        run: bash gradlew --no-daemon clean build prepareClientRun runGameTestServer
      - name: Check client model geometry
        run: python tools/verify_client_models.py
      - name: Export editable models and animation tool
        run: python tools/export_blockbench_models.py
      - name: Check native resources and world math
        run: python tools/verify_offline.py
      - name: Install software OpenGL display
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0
      - name: Draw actual models and compile bundled shader in Minecraft
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x900x24' python tools/run_visual_smoke.py --timeout 240 --emit-base64
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadowslave-build-logs
          path: |
            shadowslave/build/reports/
            shadowslave/run/logs/
          if-no-files-found: ignore
      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: shadowslave-0.6.0-rework.3
          path: shadowslave/build/libs/shadowslave-0.6.0-rework.3.jar
          if-no-files-found: error
      - name: Upload editable Blockbench models and licensed plugin
        uses: actions/upload-artifact@v4
        with:
          name: shadowslave-blockbench-models-and-animation-tools
          path: shadowslave/build/reports/blockbench-models/
          if-no-files-found: error
      - name: Upload actual Minecraft visual previews
        uses: actions/upload-artifact@v4
        with:
          name: shadowslave-native-client-previews
          path: shadowslave/build/reports/visual-smoke/*.png
          if-no-files-found: error
